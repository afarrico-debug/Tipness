orders:()=>{const f={Berlangsung:o=>!o.done&&!o.canc,Selesai:o=>o.done,Dibatalkan:o=>o.canc},l=S.orders.filter(f[S.tab]);return`<h1 class="pt">Pesanan Saya</h1><div class="tabs" style="margin-top:12px">${Object.keys(f).map(t=>`<button class="chip ${S.tab==t?'on':''}" onclick="S.tab='${t}';render()">${t}</button>`).join('')}</div>`+(!S.orders.length?`<div class="empty"><div></div><b>Belum ada pesanan. Yuk, titip kuliner favoritmu!</b><button class="btn" onclick="go('explore')">Mulai titip</button></div>`:!l.length?`<div class="empty"><b>Tidak ada pesanan di tab ini</b></div>`:l.map(o=>`<div class="card pad"><div class="row" style="margin:0"><b>${o.id}</b><span class="bd">${stText(o)}</span></div><small>${o.t} (waktu simulasi)</small>${o.items.map(i=>`<small>${i.q}× ${esc(i.n)}</small>`).join('')}<div class="row"><b>${rp(o.c.total)}</b><div class="chips" style="margin:0"><button class="btn sm" onclick="go('track','${o.id}')">Lacak</button><button class="btn sm gh" onclick="go('chat')">Chat</button>${o.done&&!o.rated?`<button class="btn sm o" onclick="go('rate','${o.id}')">Beri Rating</button>`:o.rated?'<small>★ Sudah dinilai</small>':''}${o.st==0&&!o.canc&&!o.done?`<button class="btn sm rd" onclick="cx('${o.id}')">Batalkan</button>`:''}</div></div></div>`).join(''))},
rate:()=>{const o=oid();if(!o||o.st<4)return`<div class="empty"><div>★</div><b>Rating belum tersedia</b>Rating bisa diberikan setelah pesanan tiba di kos.</div>`;if(o.rated){const r=S.revs.find(r=>r.oid==o.id)||{s:0,tags:[],cm:''};return`<div class="card pad" style="text-align:center"><div style="font-size:50px"></div><h2>Terima kasih atas ulasanmu!</h2><b>${'★'.repeat(r.s)}</b><p>${r.tags.map(t=>`<span class="bd">${t}</span>`).join(' ')}</p><small>${esc(r.cm)}</small><br><span class="bd">Pesanan ${o.id} selesai</span><br><br><button class="btn" onclick="go('orders')">Lihat Pesanan</button></div>`}
return`<h1 class="pt">Bagaimana Pengalaman Jastip Kamu?</h1><div class="card pad" style="margin-top:12px;text-align:center"><div>${[1,2,3,4,5].map(n=>`<button class="star ${S.stars>=n?'on':''}" aria-label="${n} bintang" onclick="S.stars=${n};render()">★</button>`).join('')}</div><div class="chips" style="justify-content:center">${['Gercep','Ramah','Harga transparan','Pesanan lengkap','Komunikatif','Pengantaran sesuai estimasi'].map(t=>`<button class="chip ${S.tags.includes(t)?'on':''}" onclick="tg('${t}')">${t}</button>`).join('')}</div><textarea rows="3" placeholder="Tulis komentar (opsional)" oninput="S.cm=this.value">${esc(S.cm)}</textarea><button class="btn" style="width:100%" onclick="rev()">Kirim Ulasan</button></div>`},
profile:()=>{const p=S.prof,ok=S.orders.filter(o=>!o.canc),sv2=ok.reduce((a,o)=>a+(o.c.d||0),0);return`<h1 class="pt">Profil</h1><div class="perk" style="margin-top:12px"><div> Total pesanan<br><big>${ok.length}</big></div><div> Hemat dari voucher<br><big>${rp(sv2)}</big></div><div> Voucher tersedia<br><big>${Object.keys(VC).length}</big></div></div><div class="card pad"><label>Nama</label><input id="pn" value="${esc(p.n)}"><label>Nomor telepon (simulasi)</label><input id="pp" value="${esc(p.p)}"><label>Alamat kos</label><input id="pl" value="${esc(p.l)}" placeholder="Sekaran, Gunungpati"><button class="btn" onclick="sp()">Simpan Profil</button></div><h2>Voucher tersedia</h2>${Object.entries(VC).map(([k,v])=>`<div class="card pad"><b>${k}</b><small>${v}</small></div>`).join('')}<button class="btn gh" onclick="go('orders')">Lihat riwayat pesanan</button> <button class="btn o" onclick="go('join')">Gabung Mitra</button>`},
titip:()=>{const d=S.td;if(d)return`<div class="card pad" style="text-align:center"><div style="font-size:50px"></div><h2>Titipan terkirim</h2><b>${d.id}</b><p>${d.q}× ${esc(d.items[0].n)} · estimasi ${rp(d.c.sub)}</p><span class="bd">Menunggu konfirmasi jastiper</span><br><br><button class="btn" onclick="S.td=null;go('orders')">Lihat di Pesanan Saya</button> <button class="btn gh" onclick="S.td=null;render()">Titip lagi</button></div>`;
return`<h1 class="pt">Titip Apa Aja</h1><p style="color:var(--m);margin:6px 0 12px">Barang yang kamu cari nggak ada di daftar? Kirim permintaan, biar jastiper Tipness bantu carikan.</p><div class="card pad"><label>Nama barang</label><input id="tn" placeholder="Mis. Serum wajah, es krim viral"><label>Nama toko / lokasi</label><input id="ts" placeholder="Mis. Paragon Mall"><label>Link referensi produk</label><input id="tl" placeholder="https://..."><label>Foto referensi (opsional)</label><input id="tf" type="file" accept="image/*"><small>Demo: hanya nama file yang dicatat, tidak diunggah ke server.</small><label>Estimasi harga barang (Rp)</label><input id="te" type="number" min="0"><label>Jumlah</label><input id="tj" type="number" min="1" value="1"><label>Catatan tambahan</label><textarea id="tc" rows="2"></textarea><div class="err" id="te1"></div><button class="btn" style="width:100%" onclick="tt()">Ajukan Titipan</button></div>`},
join:()=>{const k=S.jt=='Kurir',f=(id,l,ph,ty)=>`<label>${l}</label><input id="${id}" placeholder="${ph||''}" ${ty?'type="'+ty+'"':''}>`;
return`<h1 class="pt">Gabung Jadi Mitra Tipness</h1><p style="color:var(--m);margin:6px 0 12px">Daftar sebagai jastiper atau merchant. Di demo ini pendaftaran hanya tersimpan di perangkatmu dan belum diverifikasi tim sungguhan.</p><div class="tabs">${['Kurir','Merchant'].map(t=>`<button class="chip ${S.jt==t?'on':''}" onclick="S.jt='${t}';render()">Daftar sebagai ${t}</button>`).join('')}</div><div class="card pad">`+(k?f('jn','Nama lengkap','Nama kamu')+f('jp','Nomor telepon (simulasi)','08xxxxxxxxxx','tel')+f('ja','Area jemput yang biasa dilewati','Mis. Semarang Bawah')+`<label>Kendaraan</label><select id="jv"><option>Motor</option><option>Mobil</option></select><label>Hari dan jam tersedia</label><textarea id="jm" rows="2" placeholder="Mis. Jumat dan Sabtu, 15.00-19.00"></textarea>`:f('jn','Nama usaha','Mis. Warung Bu Sri')+f('jo','Nama pemilik')+f('jp','Nomor telepon (simulasi)','08xxxxxxxxxx','tel')+f('ja','Alamat atau lokasi usaha','Mis. Jl. ..., Semarang')+`<label>Kategori</label><select id="jv"><option>Makanan</option><option>Minuman</option><option>Camilan</option><option>Barang Viral</option><option>Kebutuhan Mahasiswa</option></select><label>Menu atau produk unggulan</label><textarea id="jm" rows="2" placeholder="Mis. Nasi goreng, mie ayam"></textarea>`+f('jh','Kisaran harga','Mis. Rp10.000-Rp25.000'))+`<label style="display:flex;gap:8px;align-items:flex-start;margin:6px 0 10px"><input id="jc" type="checkbox" style="width:auto;margin:3px 0 0">${k?'Saya bersedia menerapkan harga dan biaya yang transparan kepada pemesan.':'Saya setuju produk dan harga yang saya isi ditampilkan di Tipness.'}</label><div class="err" id="je"></div><button class="btn" style="width:100%" onclick="jsub()">Kirim Pendaftaran</button></div>`+(S.reg.length?`<h2>Pendaftaran Saya</h2>`+S.reg.map(r=>`<div class="card pad"><div class="row" style="margin:0"><div><b>${esc(r.nm)}</b><small>${r.type} · ${r.id} · ${r.t}</small></div><span class="bd">${r.st}</span></div><button class="btn sm rd" style="margin-top:8px" onclick="jdel('${r.id}')">Hapus</button></div>`).join(''):'')},
how:()=>`<h1 class="pt">Cara Kerja Tipness</h1><div style="margin-top:12px">${[['','Pilih atau titip bebas','Pilih merchant atau tulis barang yang kamu mau lewat Titip Apa Aja.'],['','Cek biaya transparan','Harga, fee platform, ongkir, dan voucher dirinci terpisah.'],['','Jastiper berangkat','Jastiper membeli di Semarang Bawah lalu naik lewat Trangkil.'],['','Terima di kos','Konfirmasi pesanan, lalu beri rating.']].map((s,i)=>`<div class="card pad row" style="justify-content:flex-start;margin-top:0"><div class="ib" style="flex:none;font-weight:800">${i+1}</div><div><b>${s[1]}</b><small>${s[2]}</small></div></div>`).join('')}</div><small>Semua proses di website ini adalah simulasi: pembayaran, GPS, dan chat belum terhubung ke layanan nyata.</small><br><button class="btn" onclick="go('explore')">Mulai Titip</button>`,
why:()=>{const pe=GRP.map((x,i)=>{const j=S.joined.includes(i)?1:0,n=x[1]+j;return`<div class="card pad"><div class="row" style="margin:0"><div><b>${x[0]}</b><small>${x[3]} · batas pesan ${x[2]}</small><small>${n} peserta · ongkir ≈ ${rp(24000/n)}/orang (simulasi)</small></div><button class="btn sm ${j?'rd':''}" onclick="jn(${i})">${j?'Keluar':'Gabung Pesanan'}</button></div></div>`}).join('');
return`<h1 class="pt">Keunggulan Tipness</h1><div class="grid" style="margin-top:12px">${[['','Collective Jastip','Pesanan searah digabung. Simulasi: sendiri Rp15.000, kolektif Rp8.000 per orang.'],['','Tipis Fee','Fee platform Rp1.000-Rp3.000 per pesanan dan selalu ditampilkan jelas.'],['','Titip Bebas','Minta beli barang di luar menu merchant.'],['','Jalur Sekaran','Fokus melayani Sekaran dan Gunungpati lewat Trangkil.']].map(x=>`<div class="card pad"><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div>
<h2>Titip Bareng Teman</h2>${pe}<h2>Patungan Ongkir</h2><div class="card pad"><label>Ongkir perjalanan (Rp)</label><input id="pg" type="number" value="24000" oninput="pc()"><label>Jumlah pemesan</label><input id="pj" type="number" value="4" min="1" oninput="pc()"><b id="pr"></b></div><h2>Estimasi Hemat</h2><div class="card pad"><label>Biaya turun sendiri, pergi-pulang (Rp)</label><input id="hs" type="number" value="40000" oninput="pc()"><label>Biaya jastip kolektif (ongkir + fee, Rp)</label><input id="hk" type="number" value="${SHIP.kolektif+FEE}" oninput="pc()"><b id="hr"></b><small>Hanya estimasi dari angka yang kamu isi. Hasil nyata bergantung pada biaya transportasi dan waktumu.</small></div>`}};
function jsub(){const v=i=>(g(i)?g(i).value.trim():''),k=S.jt=='Kurir',e=g('je');
if(v('jn').length<2||!/^[0-9+]{9,}$/.test(v('jp'))||!v('ja')||(!k&&!v('jo'))||!v('jm'))return e.textContent='Lengkapi semua kolom dan isi nomor telepon yang valid (min. 9 digit).';
if(!g('jc').checked)return e.textContent='Centang persetujuan terlebih dahulu.';
S.reg.unshift({id:'REG-'+Date.now().toString(36).toUpperCase().slice(-5),type:k?'Kurir':'Merchant',nm:v('jn'),t:now(),st:'Menunggu verifikasi (simulasi)'});save();render();scrollTo(0,0);toast('Pendaftaran terkirim (simulasi)')}
function jdel(id){ask('Hapus pendaftaran '+id+'?',()=>{S.reg=S.reg.filter(r=>r.id!=id);save();render();toast('Pendaftaran dihapus')})}
function pc(){const n=Math.max(1,+g('pj').value||1);g('pr').textContent=`Rp${(+g('pg').value||0).toLocaleString('id-ID')} dibagi ${n} orang = ${rp((+g('pg').value||0)/n)} per orang`;const d=(+g('hs').value||0)-(+g('hk').value||0);g('hr').textContent=d>=0?`Perkiraan hemat ${rp(d)}`:`Jastip lebih mahal ${rp(-d)} dari asumsimu`}
function jn(i){S.joined.includes(i)?S.joined=S.joined.filter(x=>x!=i):(S.joined.push(i),S.mode='kolektif');save();render();pc();toast('Pilihan kelompok disimpan')}
function tq(i,d){const e=g('q'+i);e.textContent=Math.max(1,Math.min(20,+e.textContent+d))}
function addn(i,t){const e=g('n'+i);e.value=e.value?e.value+', '+t:t}
function add(i){const n=g('n'+i).value.trim(),q=+g('q'+i).textContent,x=S.cart.find(c=>c.m==S.mid&&c.i==i&&c.n==n);x?x.q+=q:S.cart.push({m:S.mid,i,q,n});save();ui();toast(q+'× '+M[S.mid].i[i][0]+' masuk keranjang')}
function cq(k,d){S.cart[k].q+=d;if(S.cart[k].q<1)S.cart.splice(k,1);save();render()}
const now=()=>new Date().toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),hm=()=>new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
const mk=(o)=>({id:'TPN-'+Date.now().toString(36).toUpperCase().slice(-5)+Math.floor(Math.random()*90+10),t:now(),st:0,done:0,canc:0,rated:0,j:J[Math.floor(Math.random()*3)],tm:[hm()],...o});
function place(){const v=(i,e,m)=>{const x=g(i).value.trim();g(e).textContent=x.length>=(i=='cp'?9:2)&&(i!='cp'||/^[0-9+]+$/.test(x))?'':m;return x},n=v('cn','e1','Nama wajib diisi.'),p=v('cp','e2','Isi nomor telepon yang valid (min. 9 digit).'),l=v('cl','e3','Lokasi pengantaran wajib diisi.');if(!n||g('e1').textContent||g('e2').textContent||g('e3').textContent)return toast('Lengkapi data wajib dulu');
const c=calc();if(c.err)return toast(c.err);const pay=g('cy').value;S.prof={n,p,l};
const o=mk({items:S.cart.map(x=>({n:M[x.m].i[x.i][0],q:x.q,note:x.n,price:mp(x)})),ms:[...new Set(S.cart.map(x=>M[x.m].n))],c:{...c},pay:pay=='Tunai saat pesanan tiba'?'Bayar tunai saat tiba':'Menunggu pembayaran ('+pay+', simulasi)',name:n,loc:l,slot:g('ct').value,note:g('cc').value});
S.orders.unshift(o);S.cart=[];S.vc='';S.cur=o.id;save();go('confirm')}
function tt(){const n=g('tn').value.trim(),q=+g('tj').value,e=+g('te').value||0;if(!n||q<1||e<0){g('te1').textContent='Nama barang wajib diisi dan jumlah minimal 1.';return}
const note=[g('ts').value&&'Toko: '+g('ts').value,g('tl').value&&'Link: '+g('tl').value,g('tf').files[0]&&'Foto: '+g('tf').files[0].name,g('tc').value].filter(Boolean).join(' | ');
const c={sub:e*q,fee:FEE,ship:SHIP.kolektif,d:0,total:e*q+FEE+SHIP.kolektif},o=mk({titip:1,q,items:[{n,q,note,price:e}],ms:[],c,pay:'Menunggu konfirmasi harga jastiper'});S.orders.unshift(o);S.cur=o.id;S.td=o;save();render();toast('Titipan diajukan')}
function cx(id){ask('Batalkan pesanan '+id+'? Tindakan ini tidak dapat dibatalkan.',()=>{const o=S.orders.find(o=>o.id==id);o.canc=1;save();render();toast('Pesanan dibatalkan')})}
function sim(){const o=oid();clearInterval(tm);tm=setInterval(()=>{if(S.v!='track'||o.st>=4)return clearInterval(tm);o.st++;o.tm[o.st]=hm();save();render();if(o.st==4)toast('Pesanan sampai di kos!')},2200)}
function recv(){const o=oid();o.done=1;save();go('rate',o.id)}
function tg(t){S.tags.includes(t)?S.tags=S.tags.filter(x=>x!=t):S.tags.push(t);render()}
function rev(){const o=oid();if(!S.stars)return toast('Pilih rating bintang dulu');if(o.rated)return;S.revs.push({oid:o.id,s:S.stars,tags:S.tags,cm:S.cm,t:now()});o.rated=1;o.done=1;save();render()}
function sp(){S.prof={n:g('pn').value.trim(),p:g('pp').value.trim(),l:g('pl').value.trim()};save();toast('Profil disimpan')}
function snd(t){const i=g('ci'),x=(t||(i&&i.value)||'').trim();if(!x)return;S.chat.push({me:1,t:x,w:hm()});save();render();const c=g('cx');c.scrollTop=1e5;setTimeout(()=>{const o=S.orders.find(o=>!o.canc&&!o.done),l=x.toLowerCase();let r='Siap kak, pesan kamu sudah kucatat ya!';if(/dibeli|beli/.test(l))r='Pesananmu sedang diproses ya kak, kukabari kalau sudah dibeli.';else if(/posisi|dimana|trangkil|otw/.test(l))r=o?'Status simulasi: '+ST[o.st][2]+'.':'Belum ada pesanan aktif, jadi belum ada perjalanan.';g('cx')&&0;S.chat.push({me:0,t:r,w:hm()});save();if(S.v=='chat'){render();g('cx').scrollTop=1e5}else toast(' Pesan baru dari jastiper (simulasi)')},900)}
render();if(location.hash=='#x')pc();
</script></body></html>
